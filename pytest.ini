[pytest]
# Test discovery
testpaths       = Testing
python_files    = test_*.py *_test.py
python_functions = test_
python_classes   = Test

# Markers for test organization
markers =
    workflow_coverage: DEW/PerplexDEW acceptance checklist — run with pytest -m workflow_coverage
    regression: Extended regression and integration tests
    unit: Unit-level component tests
    bindings: Python binding validation tests
    smoke: End-to-end smoke tests
    slow: Tests that take >10 seconds
    experimental: Experimental or bleeding-edge features
    requires_gfsm: Tests requiring PerplexGFSM gas phase
    requires_dew_db: Tests requiring DEW database
    requires_equilibrium: Tests requiring equilibrium solver

# Collection and execution
norecursedirs   = __pycache__ .git .pytest_cache build build-* temp temp_build .env
addopts         =
    --strict-markers
    --tb=short
    -ra
    --timeout=300

# Logging
log_cli          = false
log_cli_level    = WARNING
log_file         = test_results.log
log_file_level   = DEBUG

# Performance
junit_family     = xunit2
